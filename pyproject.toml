[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchctl"
version = "0.1.0"
description = "Run Rigol bench recipes and explore measurements in interactive offline reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
benchctl = "benchctl.cli:main"

[tool.setuptools.packages.find]
where = ["08_Software/src"]

[tool.pytest.ini_options]
testpaths = ["08_Software/tests"]
