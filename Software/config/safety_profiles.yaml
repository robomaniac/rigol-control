# Manually maintained limits: review them against your actual hardware.
# The example inventory selects purpose-limited 5 V demo profiles below.
# Legacy physical profiles remain available for existing local inventories;
# their model names do not establish the ratings of a different instrument.
# Software bounds complement separately configured hardware protections.

schema_version: 1

profiles:
  # Purpose-limited examples for the 5 V demo; these are operating bounds,
  # not declarations of an instrument's full ratings. Review your hardware.
  demo_supply_5v:
    type: power_supply
    channels:
      1: {max_voltage_v: 6.0, max_current_a: 0.5, max_power_w: 3.0}
      2: {max_voltage_v: 6.0, max_current_a: 0.5, max_power_w: 3.0}

  demo_load_5v:
    type: electronic_load
    max_voltage_v: 6.0
    max_current_a: 0.5
    max_power_w: 3.0
    allowed_modes: [cc]

  # Rigol DP821 datasheet: CH1 60 V / 1 A / 60 W, CH2 8 V / 10 A / 80 W.
  dp821_physical:
    type: power_supply
    channels:
      1:
        max_voltage_v: 60.0
        max_current_a: 1.0
        max_power_w: 60.0
      2:
        max_voltage_v: 8.0
        max_current_a: 10.0
        max_power_w: 80.0

  # Rigol DL3021 datasheet: 150 V / 40 A / 200 W.
  dl3021_physical:
    type: electronic_load
    max_voltage_v: 150.0
    max_current_a: 40.0
    max_power_w: 200.0
    allowed_modes: [cc, cv, cr, cp]
