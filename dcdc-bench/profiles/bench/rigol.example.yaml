notes:
- TEMPLATE ONLY. Confirm physical source/load model, firmware, identity, capabilities
  and wiring before live operation.
- DP821-family CH1 has 60 V / 1 A envelope and no CH1 remote sense. Physical unit
  identity remains unconfirmed.
- The actual load model and ratings remain unknown; a reported or modified ID string
  does not establish physical ratings.
- No endpoints, serials, readback accuracy, or safety approval are provided. All real
  execution remains unavailable in M0/M1.
- Readback specifications are unknown until the owner transcribes them from R1/R4 for the
  exact model and range and records calibration status; the budget stays not_evaluated.
