notes:
- SYNTHETIC profiles model a coupled converter and source/load. These are not observations
  of the physical DUT.
- The synthetic source uses the published CH1 voltage/current envelope; the synthetic
  load capabilities are simulation assumptions.
- Readback uncertainty is unquantified. Programming accuracy is not substituted.
- Source-terminal input measurements include input wiring losses in path efficiency.
- Temperature channels come from a first-order synthetic case model driven by the plant's
  synthetic module loss (mock_thermal adapter). They are selectable only for a mock bench;
  a real thermal test requires real configured acquisition channels. No photograph or
  sensor placement exists for this synthetic setup, so placement is null, not invented.
