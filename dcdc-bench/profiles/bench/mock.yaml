schema_version: '1.0'
bench_id: mock-dp821-envelope
mode: mock
source:
  instrument_id: synthetic-source
  adapter: mock_source
  physical_model: null
  reported_identity: SYNTHETIC source with CH1 envelope
  channel: 1
  capabilities_confirmed: true
  min_voltage_V: 0.0
  max_voltage_V: 60.0
  max_current_A: 1.0
  max_power_W: 60.0
  remote_sense_supported: false
  remote_sense_required: false
load:
  instrument_id: synthetic-load
  adapter: mock_load
  physical_model: null
  reported_identity: SYNTHETIC load; not a physical model rating
  capabilities_confirmed: true
  min_voltage_V: 0.15
  max_voltage_V: 150.0
  max_current_A: 40.0
  max_power_W: 300.0
  remote_sense_supported: true
  # Local sense, as on the physical DP821A/DL3031A bench (no S+/S- leads are wired there). The
  # remote-sense branch is exercised by profiles/bench/mock-remote-sense.yaml instead.
  remote_sense_required: false
  mode: CC
  min_current_A: 0.0
# Every readback_specification below is a SYNTHETIC EXAMPLE (status synthetic_example).
