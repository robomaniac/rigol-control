uncertainty_policy:
  coverage_factor: 2.0
  linear_model_relative_uncertainty_bound: 0.1
  include_repeatability_in_combined: true
  policy_origin: draft default; adjust with a recorded justification
readback_correlations: []
measurement_boundary: source-to-load-terminal path (input and output wiring included; load in local sense)
notes:
- SYNTHETIC profiles model a coupled converter and source/load. These are not observations
  of the physical DUT. The plant (coupled-dc-2.0) is fitted to the recorded behaviour of the
  first converter sample; see docs/simulation-plant.md for what it models and what it deliberately does not.
- The synthetic source uses the published CH1 voltage/current envelope; the synthetic
  load capabilities are simulation assumptions.
- Readback specifications are SYNTHETIC EXAMPLES so the mock path demonstrates an evaluated
  budget; they describe no instrument. Programming accuracy is not substituted for readback.
- 'The boundary mirrors the physical bench: local load sensing at the load terminals, so input and
  output wiring losses (0.06 ohm and 0.10 ohm in the plant) are inside path efficiency; no S+/S-
  leads are depicted.'
- 'Readbacks are quantised to the instruments'' displayed digits and held per channel; the load''s
  current readback carries the recorded +11 mA offset under load and the 0 / 11 mA alternation with
  its input OFF, so the readback cross-check and freshness paths are exercised by the plant.'
